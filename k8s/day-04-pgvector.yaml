apiVersion: v1
kind: Service
metadata:
  name: pgvector
  namespace: ai-lab
spec:
  type: ClusterIP
  selector: {app: pgvector}
  ports:
  - {port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pgvector
  namespace: ai-lab
spec:
  serviceName: pgvector
  replicas: 1
  selector:
    matchLabels: {app: pgvector}
  template:
    metadata:
      labels: {app: pgvector}
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg17
        ports:
        - containerPort: 5432
        env:
        - {name: POSTGRES_USER, value: rag}
        - {name: POSTGRES_DB, value: rag}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: pgvector-auth, key: POSTGRES_PASSWORD}
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {memory: 2Gi}
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "rag", "-d", "rag"]
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path
      resources:
        requests:
          storage: 10Gi
