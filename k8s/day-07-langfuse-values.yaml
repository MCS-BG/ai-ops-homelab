# Day 7 (stage B): self-hosted Langfuse v4 on the Surface, sized for a lab.
# Chart: langfuse/langfuse 2.1.2 (appVersion 4.38.0). Chart v2 bundles:
#   postgres (groundhog2k chart, postgres:18), valkey (valkey-io chart, valkey 8.0),
#   SeaweedFS all-in-one (S3-compatible blob store) and ClickHouse 26.4 + Keeper via the
#   ClickHouse operator (ClickHouseCluster / KeeperCluster CRs).
# Prerequisites (once per cluster): cert-manager v1.20.2 and clickhouse-operator 0.0.5,
#   see day-07-cert-manager-values.yaml and day-07-clickhouse-operator-values.yaml.
# The sizes below are deliberately BELOW Langfuse's documented minimums
# (https://langfuse.com/self-hosting/configuration/scaling). Fine for one user and a
# few thousand traces a day; not a production sizing.
# Credentials (salt, encryption key, NextAuth secret, datastore passwords) are generated by
# the chart on first install and reused on upgrades (helm lookup). Do not "helm template | kubectl apply".
# Install:
#   helm upgrade -i langfuse langfuse/langfuse --version 2.1.2 \
#     -n langfuse -f ~/ai-ops-homelab/k8s/day-07-langfuse-values.yaml

langfuse:
  nodeSelector:
    ailab/role: observability
  tolerations:
    - key: ailab/role
      operator: Equal
      value: observability
      effect: NoSchedule

  features:
    telemetryEnabled: false
    signUpDisabled: true

  # Reached through "kubectl port-forward svc/langfuse-web 3002:3000".
  nextauth:
    url: http://localhost:3002

  # Headless initialization: org, project, API keys and the admin user are created on first
  # start from the Secret "langfuse-init" (created in the step file, never printed).
  # https://langfuse.com/self-hosting/administration/headless-initialization
  additionalEnv:
    - name: LANGFUSE_INIT_ORG_ID
      value: ailab
    - name: LANGFUSE_INIT_ORG_NAME
      value: AI Lab
    - name: LANGFUSE_INIT_PROJECT_ID
      value: ai-lab
    - name: LANGFUSE_INIT_PROJECT_NAME
      value: ai-lab
    - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
      valueFrom:
        secretKeyRef:
          name: langfuse-init
          key: public-key
    - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: langfuse-init
          key: secret-key
    - name: LANGFUSE_INIT_USER_EMAIL
      valueFrom:
        secretKeyRef:
          name: langfuse-init
          key: user-email
    - name: LANGFUSE_INIT_USER_NAME
      value: admin
    - name: LANGFUSE_INIT_USER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: langfuse-init
          key: user-password

  web:
    resources:
      requests:
        cpu: 100m
        memory: 768Mi
      limits:
        memory: 1536Mi
    # A laptop CPU plus first-start migrations can take longer than the default 20s + 3 x 10s.
    livenessProbe:
      initialDelaySeconds: 120
      failureThreshold: 6
    readinessProbe:
      initialDelaySeconds: 30
    pdb:
      create: false

  worker:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    livenessProbe:
      initialDelaySeconds: 120
    pdb:
      create: false

postgresql:
  nodeSelector:
    ailab/role: observability
  tolerations:
    - key: ailab/role
      operator: Equal
      value: observability
      effect: NoSchedule
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  storage:
    requestedSize: 5Gi
    className: local-path

redis:
  nodeSelector:
    ailab/role: observability
  tolerations:
    - key: ailab/role
      operator: Equal
      value: observability
      effect: NoSchedule
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      memory: 384Mi
  dataStorage:
    requestedSize: 1Gi
    className: local-path

clickhouse:
  cluster:
    replicas: 1
    nodeSelector:
      ailab/role: observability
    tolerations:
      - key: ailab/role
        operator: Equal
        value: observability
        effect: NoSchedule
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 2Gi
    storage:
      size: 10Gi
      className: local-path
    # Low-memory server settings (https://clickhouse.com/docs/operations/tips) and the
    # system log tables Langfuse recommends dropping
    # (https://langfuse.com/self-hosting/deployment/infrastructure/clickhouse).
    settings:
      max_server_memory_usage_to_ram_ratio: 0.75
      mark_cache_size: 268435456
      index_mark_cache_size: 67108864
      trace_log:
        "@remove": 1
      text_log:
        "@remove": 1
      metric_log:
        "@remove": 1
      asynchronous_metric_log:
        "@remove": 1
      latency_log:
        "@remove": 1
      opentelemetry_span_log:
        "@remove": 1
    profileSettings:
      profiles:
        default:
          max_threads: 2
          max_block_size: 8192
          max_download_threads: 1
          input_format_parallel_parsing: 0
          output_format_parallel_formatting: 0
  keeper:
    # Keeper must stay enabled (the ClickHouseCluster CR needs it); one replica is enough here.
    replicas: 1
    nodeSelector:
      ailab/role: observability
    tolerations:
      - key: ailab/role
        operator: Equal
        value: observability
        effect: NoSchedule
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    storage:
      size: 2Gi
      className: local-path

s3:
  allInOne:
    # The SeaweedFS subchart takes nodeSelector/tolerations as multi-line strings.
    nodeSelector: |
      ailab/role: observability
    tolerations: |
      - key: ailab/role
        operator: Equal
        value: observability
        effect: NoSchedule
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        memory: 768Mi
    data:
      size: 5Gi
      storageClass: local-path
