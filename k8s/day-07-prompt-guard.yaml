# Day 7 part 2: Prompt Guard 2 classifier service in ai-lab (CPU, on the lab host).
# Generated by prompt-guard/build_manifest.py from prompt-guard/server.py and download.py.
# Model: meta-llama/Llama-Prompt-Guard-2-22M (gated on Hugging Face, Llama 4 Community License).
#   Before applying: request access on the model page, then create the Secret hf-token
#   (see docs/day-07-observability-steps.md). The token is only used by the init container.
# Why CPU on the lab host: ollama holds the 4 GB RTX 3050 Ti (no time-slicing), the Surface
#   RAM is budgeted for observability, and the 22M model answers in tens of ms on a laptop CPU.
# First start installs ~1.2 GB of Python packages (torch CPU, transformers) and ~0.3 GB of model
#   into the prompt-guard-cache PVC (pip's temp dir is on the PVC too, not in /tmp); later restarts reuse the cache and run fully offline.
# To switch to the multilingual 86M model: change MODEL_ID and MODEL_DIR in build_manifest.py.
# Apply:
#   kubectl apply -f ~/ai-ops-homelab/k8s/day-07-prompt-guard.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prompt-guard-code
  namespace: ai-lab
  labels:
    app: prompt-guard
data:
  server.py: |
    """Prompt Guard classifier service (Day 7, part 2).

    POST /classify {"text": "...", "threshold": 0.5}
      -> {"label": "malicious"|"benign", "malicious_score": 0.97, "chunks": 1, "latency_ms": 21.4, "model": "..."}
    GET /healthz -> "ok" once the model is loaded.

    Model: meta-llama/Llama-Prompt-Guard-2-22M (or -86M), loaded from the local cache only
    (HF_HUB_OFFLINE=1). Inputs longer than the 512-token context are split into overlapping
    windows; the highest malicious probability across windows wins.
    """
    import os
    import time

    import torch
    from fastapi import FastAPI, HTTPException
    from fastapi.responses import PlainTextResponse
    from pydantic import BaseModel, Field
    from transformers import AutoModelForSequenceClassification, AutoTokenizer

    MODEL_DIR = os.environ.get("MODEL_DIR", "/cache/models/Llama-Prompt-Guard-2-22M")
    MODEL_ID = os.environ.get("MODEL_ID", "meta-llama/Llama-Prompt-Guard-2-22M")
    MAX_LEN = int(os.environ.get("MAX_TOKENS", "512"))
    STRIDE = int(os.environ.get("STRIDE", "64"))
    MAX_CHARS = int(os.environ.get("MAX_CHARS", "20000"))
    DEFAULT_THRESHOLD = float(os.environ.get("THRESHOLD", "0.5"))

    torch.set_num_threads(int(os.environ.get("TORCH_THREADS", "2")))

    tokenizer = AutoTokenizer.from_pretrained(MODEL_DIR)
    model = AutoModelForSequenceClassification.from_pretrained(MODEL_DIR)
    model.eval()


    def _malicious_index() -> int:
        id2label = getattr(model.config, "id2label", None) or {}
        for idx, name in id2label.items():
            if "malicious" in str(name).lower() or "injection" in str(name).lower():
                return int(idx)
        return 1


    MALICIOUS_IDX = _malicious_index()


    def _encode_windows(text: str) -> dict:
        """Tokenize once, then cut into overlapping windows of MAX_LEN tokens (with CLS/SEP)."""
        ids = tokenizer(text, add_special_tokens=False, verbose=False)["input_ids"]
        body = MAX_LEN - 2
        step = max(body - STRIDE, 1)
        windows = [ids[i:i + body] for i in range(0, max(len(ids) - STRIDE, 1), step)] or [[]]
        cls_id, sep_id = tokenizer.cls_token_id, tokenizer.sep_token_id
        pad_id = tokenizer.pad_token_id or 0
        seqs = [[cls_id] + w + [sep_id] for w in windows]
        width = max(len(x) for x in seqs)
        input_ids = torch.tensor([x + [pad_id] * (width - len(x)) for x in seqs])
        attention = torch.tensor([[1] * len(x) + [0] * (width - len(x)) for x in seqs])
        return {"input_ids": input_ids, "attention_mask": attention}

    app = FastAPI(title="prompt-guard", docs_url=None, redoc_url=None, openapi_url=None)


    class ClassifyRequest(BaseModel):
        text: str = Field(min_length=1)
        threshold: float | None = Field(default=None, ge=0.0, le=1.0)


    @app.get("/healthz", response_class=PlainTextResponse)
    def healthz() -> str:
        return "ok"


    @app.post("/classify")
    def classify(req: ClassifyRequest) -> dict:
        if len(req.text) > MAX_CHARS:
            raise HTTPException(status_code=413, detail=f"text longer than {MAX_CHARS} characters")
        start = time.perf_counter()
        enc = _encode_windows(req.text)
        with torch.inference_mode():
            logits = model(**enc).logits
        probs = torch.softmax(logits, dim=-1)[:, MALICIOUS_IDX]
        score = float(probs.max())
        threshold = DEFAULT_THRESHOLD if req.threshold is None else req.threshold
        return {
            "label": "malicious" if score >= threshold else "benign",
            "malicious_score": round(score, 4),
            "chunks": int(probs.shape[0]),
            "latency_ms": round((time.perf_counter() - start) * 1000, 1),
            "model": MODEL_ID,
        }
  download.py: |
    """Init step: fetch the gated Prompt Guard model into the cache PVC once."""
    import os
    import sys

    from huggingface_hub import snapshot_download

    model_id = os.environ["MODEL_ID"]
    model_dir = os.environ["MODEL_DIR"]
    if os.path.exists(os.path.join(model_dir, "config.json")):
        print(f"model cached in {model_dir}")
        sys.exit(0)
    token = os.environ.get("HF_TOKEN") or None
    if token is None:
        sys.exit("HF_TOKEN missing: create the hf-token Secret (see docs/day-07-observability-steps.md)")
    snapshot_download(
        repo_id=model_id,
        local_dir=model_dir,
        token=token,
        allow_patterns=["*.json", "*.safetensors", "*.model", "*.txt"],
    )
    print(f"downloaded {model_id} to {model_dir}")
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prompt-guard-cache
  namespace: ai-lab
  labels:
    app: prompt-guard
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prompt-guard
  namespace: ai-lab
  labels: &id001
    app: prompt-guard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      nodeSelector:
        kubernetes.io/hostname: d
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: deps
        image: python:3.12-slim
        command:
        - sh
        - -c
        - 'set -e; D=/cache/deps-v1; if [ -f "$D/.complete" ]; then echo "deps cached in $D"; exit 0; fi; rm -rf "$D" /cache/.pip-tmp; mkdir -p /cache/.pip-tmp; python -m pip install --no-cache-dir --disable-pip-version-check --only-binary=:all: --quiet --target "$D" --extra-index-url https://download.pytorch.org/whl/cpu torch==2.14.0+cpu transformers==5.17.0 huggingface-hub==1.33.0 tokenizers==0.23.2 safetensors==0.8.0 fastapi==0.141.1 uvicorn==0.54.0; rm -rf /cache/.pip-tmp; touch "$D/.complete"; echo "deps installed in $D"'
        env:
        - name: HOME
          value: /tmp
        - name: TMPDIR
          value: /cache/.pip-tmp
        securityContext: &id002
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1536Mi
        volumeMounts:
        - name: cache
          mountPath: /cache
        - name: tmp
          mountPath: /tmp
      - name: model
        image: python:3.12-slim
        command:
        - python
        - /app/download.py
        env:
        - &id003
          name: HOME
          value: /tmp
        - &id004
          name: PYTHONPATH
          value: /cache/deps-v1
        - &id005
          name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - &id006
          name: PYTHONUNBUFFERED
          value: '1'
        - &id007
          name: HF_HOME
          value: /cache/hf
        - &id008
          name: MODEL_ID
          value: meta-llama/Llama-Prompt-Guard-2-22M
        - &id009
          name: MODEL_DIR
          value: /cache/models/Llama-Prompt-Guard-2-22M
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        securityContext: *id002
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
        - name: cache
          mountPath: /cache
        - name: tmp
          mountPath: /tmp
      containers:
      - name: prompt-guard
        image: python:3.12-slim
        command:
        - python
        - -m
        - uvicorn
        - server:app
        - --app-dir
        - /app
        - --host
        - 0.0.0.0
        - --port
        - '8080'
        - --no-access-log
        env:
        - *id003
        - *id004
        - *id005
        - *id006
        - *id007
        - *id008
        - *id009
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: TRANSFORMERS_OFFLINE
          value: '1'
        - name: OMP_NUM_THREADS
          value: '2'
        - name: TORCH_THREADS
          value: '2'
        - name: THRESHOLD
          value: '0.5'
        ports:
        - name: http
          containerPort: 8080
        securityContext: *id002
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 30
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
        - name: cache
          mountPath: /cache
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: code
        configMap:
          name: prompt-guard-code
      - name: cache
        persistentVolumeClaim:
          claimName: prompt-guard-cache
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prompt-guard
  namespace: ai-lab
  labels: &id001
    app: prompt-guard
spec:
  selector: *id001
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prompt-guard-allow-ai-lab
  namespace: ai-lab
  labels: &id001
    app: prompt-guard
spec:
  podSelector:
    matchLabels: *id001
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    ports:
    - port: 8080
      protocol: TCP
