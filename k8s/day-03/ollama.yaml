apiVersion: v1
kind: PersistentVolume
metadata:
  name: ollama-models-pv
spec:
  capacity:
    storage: 200Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ailab-external
  hostPath:
    path: /mnt/ailab-data/ai-ops-homelab/ollama
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: ai-lab
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ailab-external
  volumeName: ollama-models-pv
  resources:
    requests:
      storage: 200Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: ollama}
  template:
    metadata:
      labels: {app: ollama}
    spec:
      runtimeClassName: nvidia
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        env:
        - {name: OLLAMA_HOST, value: "0.0.0.0:11434"}
        - {name: OLLAMA_MODELS, value: "/models"}
        - {name: OLLAMA_KEEP_ALIVE, value: "10m"}
        resources:
          requests: {cpu: "1", memory: 4Gi}
          limits: {memory: 8Gi, nvidia.com/gpu: 1}
        volumeMounts:
        - {name: models, mountPath: /models}
        readinessProbe:
          httpGet: {path: /, port: 11434}
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai-lab
spec:
  type: ClusterIP
  selector: {app: ollama}
  ports:
  - {port: 11434, targetPort: 11434}
