apiVersion: v1
kind: PersistentVolume
metadata:
  name: rag-docs-pv
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ailab-external
  hostPath:
    path: /mnt/ailab-data/ai-ops-homelab/docs
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-docs
  namespace: ai-lab
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ailab-external
  volumeName: rag-docs-pv
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-scripts
  namespace: ai-lab
data:
  ingest.py: |
    """Chunk Markdown files, embed them with Ollama, and store them in pgvector."""
    import glob
    import os
    import sys
    
    import psycopg
    import requests
    
    OLLAMA = os.environ.get("OLLAMA_URL", "http://127.0.0.1:11435")
    DSN = os.environ.get("PG_DSN", "host=127.0.0.1 port=15432 dbname=rag user=rag")  # password comes from PGPASSWORD
    EMBED_MODEL = "nomic-embed-text"
    MAX_CHARS = 1200
    
    
    def chunk_markdown(text):
        """Group paragraphs into chunks of up to MAX_CHARS characters."""
        chunks, current = [], ""
        for para in text.split("\n\n"):
            para = para.strip()
            if not para:
                continue
            if current and len(current) + len(para) + 2 > MAX_CHARS:
                chunks.append(current)
                current = para
            else:
                current = current + "\n\n" + para if current else para
        if current:
            chunks.append(current)
        return chunks
    
    
    def embed(texts):
        r = requests.post(f"{OLLAMA}/api/embed",
                          json={"model": EMBED_MODEL, "input": texts}, timeout=300)
        r.raise_for_status()
        return r.json()["embeddings"]
    
    
    def to_vector(values):
        return "[" + ",".join(str(x) for x in values) + "]"
    
    
    def main():
        folder = os.path.expanduser(sys.argv[1] if len(sys.argv) > 1 else os.environ.get("DOCS_DIR", "/docs"))
        files = sorted(glob.glob(os.path.join(folder, "*.md")))
        if not files:
            sys.exit(f"No .md files found in {folder}")
    
        with psycopg.connect(DSN) as conn:
            for path in files:
                source = os.path.basename(path)
                with open(path, encoding="utf-8") as f:
                    chunks = chunk_markdown(f.read())
                vectors = embed(["search_document: " + c for c in chunks])
                with conn.cursor() as cur:
                    # Re-running replaces a file's chunks instead of duplicating them.
                    cur.execute("DELETE FROM chunks WHERE source = %s", (source,))
                    cur.executemany(
                        "INSERT INTO chunks (source, chunk, embedding) VALUES (%s, %s, %s::vector)",
                        [(source, c, to_vector(v)) for c, v in zip(chunks, vectors)],
                    )
                conn.commit()
                print(f"{source}: {len(chunks)} chunks stored")
    
    
    if __name__ == "__main__":
        main()
  ask.py: |
    """Answer a question using the closest chunks from pgvector and Llama on the lab GPU."""
    import os
    import sys
    
    import psycopg
    import requests
    
    OLLAMA = os.environ.get("OLLAMA_URL", "http://127.0.0.1:11435")
    DSN = os.environ.get("PG_DSN", "host=127.0.0.1 port=15432 dbname=rag user=rag")  # password comes from PGPASSWORD
    EMBED_MODEL = "nomic-embed-text"
    CHAT_MODEL = "llama3.2:3b"
    TOP_K = 4
    
    
    def embed(text):
        r = requests.post(f"{OLLAMA}/api/embed",
                          json={"model": EMBED_MODEL, "input": [text]}, timeout=300)
        r.raise_for_status()
        return r.json()["embeddings"][0]
    
    
    def to_vector(values):
        return "[" + ",".join(str(x) for x in values) + "]"
    
    
    def main():
        if len(sys.argv) < 2:
            sys.exit('Usage: python ask.py "your question"')
        question = " ".join(sys.argv[1:])
        qvec = to_vector(embed("search_query: " + question))
    
        with psycopg.connect(DSN) as conn, conn.cursor() as cur:
            cur.execute(
                "SELECT source, chunk, embedding <=> %s::vector AS distance "
                "FROM chunks ORDER BY distance LIMIT %s",
                (qvec, TOP_K),
            )
            rows = cur.fetchall()
        if not rows:
            sys.exit("No chunks in the database yet. Run ingest.py first.")
    
        context = "\n\n---\n\n".join(f"[{source}]\n{chunk}" for source, chunk, _ in rows)
        prompt = (
            "You answer questions about a home AI lab using only the notes below. "
            "If the notes don't contain the answer, say you don't know.\n\n"
            f"NOTES:\n{context}\n\nQUESTION: {question}\nANSWER:"
        )
        r = requests.post(f"{OLLAMA}/api/generate",
                          json={"model": CHAT_MODEL, "prompt": prompt, "stream": False,
                                "options": {"temperature": 0.2}},
                          timeout=300)
        r.raise_for_status()
    
        print(r.json()["response"].strip())
        print("\nSources:")
        for source, chunk, distance in rows:
            preview = " ".join(chunk.split())[:70]
            print(f"  {distance:.3f}  {source}  {preview}...")
    
    
    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-worker
  namespace: ai-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: rag-worker}
  template:
    metadata:
      labels: {app: rag-worker}
    spec:
      containers:
      - name: worker
        image: python:3.12-slim
        command: ["sh", "-c", "pip install --no-cache-dir --quiet 'psycopg[binary]' requests && sleep infinity"]
        workingDir: /app
        env:
        - {name: OLLAMA_URL, value: "http://ollama.ai-lab.svc.cluster.local:11434"}
        - {name: PG_DSN, value: "host=pgvector.ai-lab.svc.cluster.local port=5432 dbname=rag user=rag"}
        - {name: DOCS_DIR, value: /docs}
        - {name: PYTHONUNBUFFERED, value: "1"}
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef: {name: pgvector-auth, key: POSTGRES_PASSWORD}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
        readinessProbe:
          exec:
            command: ["python", "-c", "import psycopg, requests"]
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - {name: scripts, mountPath: /app, readOnly: true}
        - {name: docs, mountPath: /docs, readOnly: true}
      volumes:
      - name: scripts
        configMap:
          name: rag-scripts
      - name: docs
        persistentVolumeClaim:
          claimName: rag-docs
