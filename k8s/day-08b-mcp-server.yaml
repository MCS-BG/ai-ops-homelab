# Day 8b: mcp-server with Prompt Guard checks and Langfuse tool/embedding/guardrail observations.
# Same Deployment as day-08a-mcp-server.yaml plus the PROMPT_GUARD_* settings read by server.py 0.8.1:
# - PROMPT_GUARD_URL        the Day 7 classifier Service (ai-lab NetworkPolicy prompt-guard-allow-ai-lab
#                           already admits every ai-lab pod on 8080; there are no egress policies in ai-lab)
# - PROMPT_GUARD_THRESHOLD  refuse at or above this malicious_score. 0.5 is the model's own decision point
#                           (argmax over benign/malicious in Meta's Prompt Guard 2 model card)
# - PROMPT_GUARD_FAIL_OPEN  "false": if Prompt Guard is down, tool calls are refused instead of unchecked
# The image line is pinned to a commit SHA by scripts/pin-images.sh (Day 8b step 4).
# Apply:
#   kubectl apply -f ~/ai-ops-homelab/k8s/day-08b-mcp-server.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: ai-lab
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-server
          image: ghcr.io/OWNER/mcp-server:SHA
          command: ["opentelemetry-instrument", "python", "/app/server.py"]
          env:
            - name: PORT
              value: "8000"
            - name: OLLAMA_URL
              value: http://ollama.ai-lab.svc.cluster.local:11434
            - name: PG_DSN
              value: host=pgvector.ai-lab.svc.cluster.local port=5432 dbname=rag user=rag
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgvector-auth
                  key: POSTGRES_PASSWORD
            - name: FO_BASE_URL
              value: http://fo-mock.ai-lab.svc.cluster.local:8080
            - name: HOME
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: EMBED_KEEP_ALIVE
              value: "-1m"
            - name: PROMPT_GUARD_ENABLED
              value: "true"
            - name: PROMPT_GUARD_URL
              value: http://prompt-guard.ai-lab.svc.cluster.local:8080/classify
            - name: PROMPT_GUARD_THRESHOLD
              value: "0.5"
            - name: PROMPT_GUARD_FAIL_OPEN
              value: "false"
            - name: OTEL_SERVICE_NAME
              value: mcp-server
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=ai-lab,deployment.environment.name=homelab
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_PYTHON_EXCLUDED_URLS
              value: healthz
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_always_on
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
