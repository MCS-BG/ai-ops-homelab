# Day 7 (stage C): Loki in monolithic (single binary) mode on the Surface, filesystem storage,
# 48h retention. Receives logs from the OpenTelemetry Collector at /otlp.
# Chart: grafana-community/loki 18.13.5 (Loki 3.7.8). The chart moved from grafana/helm-charts
# to grafana-community/helm-charts in March 2026; grafana/loki is now GEL-only.
# Install:
#   helm upgrade -i loki grafana-community/loki --version 18.13.5 \
#     -n monitoring -f ~/ai-ops-homelab/k8s/day-07-loki-values.yaml
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 48h
    reject_old_samples: true
    reject_old_samples_max_age: 48h
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 8
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: false
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  sidecar: false
  nodeSelector:
    ailab/role: observability
  tolerations:
    - key: ailab/role
      operator: Equal
      value: observability
      effect: NoSchedule
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
  persistence:
    enabled: true
    size: 5Gi
    storageClass: local-path

sidecar:
  rules:
    enabled: false

# Everything below is off: no gateway (nginx), no memcached caches (the default
# chunks cache alone asks for several GiB), no canary/test pods, no scalable targets.
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
memcached:
  enabled: false
memcachedExporter:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
ruler:
  enabled: false
minio:
  enabled: false
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
patternIngester:
  replicas: 0
overridesExporter:
  replicas: 0
