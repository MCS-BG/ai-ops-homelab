# Only mcp-server may open connections to fo-mock.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fo-mock-allow-mcp-server
  namespace: ai-lab
spec:
  podSelector:
    matchLabels:
      app: fo-mock
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mcp-server
      ports:
        - protocol: TCP
          port: 8080
---
# mcp-server accepts connections only from pods in ai-lab (Open WebUI, the test Job).
# kubectl port-forward still works: it enters the pod's own network namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-server-allow-ai-lab
  namespace: ai-lab
spec:
  podSelector:
    matchLabels:
      app: mcp-server
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
