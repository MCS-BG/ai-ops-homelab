apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-server-code
  namespace: ai-lab
  labels:
    app: mcp-server
data:
  server.py: |
    """Day 6 MCP server for the ai-ops-homelab cluster.

    Tools:
      search_notes            semantic search over the day 4 pgvector 'chunks' table
      fo_list_entities        entity sets offered by the FO OData endpoint (the mock)
      fo_get_entity_metadata  keys and fields of one entity set, from /data/$metadata
      fo_query                read-only OData query against the mock FO service

    Transport: MCP Streamable HTTP on :8000 at /mcp (stateless, JSON responses).
    Built on the official MCP Python SDK 2.x, where FastMCP is named MCPServer.
    """
    import os
    import re
    import xml.etree.ElementTree as ET
    from typing import Any

    import psycopg
    import requests
    from mcp.server.mcpserver import MCPServer
    from mcp.server.mcpserver.exceptions import ToolError
    from mcp.server.transport_security import TransportSecuritySettings
    from starlette.requests import Request
    from starlette.responses import PlainTextResponse

    OLLAMA = os.environ.get("OLLAMA_URL", "http://ollama.ai-lab.svc.cluster.local:11434")
    DSN = os.environ.get("PG_DSN", "host=pgvector.ai-lab.svc.cluster.local port=5432 dbname=rag user=rag")  # password comes from PGPASSWORD
    FO_BASE_URL = os.environ.get("FO_BASE_URL", "http://fo-mock.ai-lab.svc.cluster.local:8080").rstrip("/")
    EMBED_MODEL = "nomic-embed-text"
    PORT = int(os.environ.get("PORT", "8000"))
    ALLOWED_HOSTS = [h.strip() for h in os.environ.get(
        "MCP_ALLOWED_HOSTS",
        "127.0.0.1:*,localhost:*,mcp-server:*,mcp-server.ai-lab:*,mcp-server.ai-lab.svc:*,mcp-server.ai-lab.svc.cluster.local:*",
    ).split(",") if h.strip()]
    EDM = "{http://docs.oasis-open.org/odata/ns/edm}"

    mcp = MCPServer(
        "ai-ops-homelab",
        instructions=(
            "Tools for the home AI lab. search_notes searches the lab notes. "
            "The fo_* tools read a MOCK Dynamics 365 finance and operations OData service with fake demo data "
            "(company usmf). Call fo_get_entity_metadata before fo_query to learn the exact field names."
        ),
        version="0.6.0",
    )


    # ---------- search_notes: same embedding and SQL as day 4 ask.py ----------

    def embed(text):
        r = requests.post(f"{OLLAMA}/api/embed", json={"model": EMBED_MODEL, "input": [text]}, timeout=120)
        r.raise_for_status()
        return r.json()["embeddings"][0]


    def to_vector(values):
        return "[" + ",".join(str(x) for x in values) + "]"


    @mcp.tool()
    def search_notes(query: str, k: int = 5) -> dict[str, Any]:
        """Search the ai-ops-homelab lab notes by meaning.

        Returns the k closest text chunks (1 to 20) with the Markdown file each came
        from and its cosine distance (lower is closer). Use it to answer questions
        about how the lab was built.
        """
        if not query.strip():
            raise ToolError("query must not be empty")
        k = max(1, min(int(k), 20))
        try:
            qvec = to_vector(embed("search_query: " + query))  # nomic-embed-text task prefix, as in ask.py
            with psycopg.connect(DSN, connect_timeout=5) as conn, conn.cursor() as cur:
                cur.execute(
                    "SELECT source, chunk, embedding <=> %s::vector AS distance "
                    "FROM chunks ORDER BY distance LIMIT %s",
                    (qvec, k),
                )
                rows = cur.fetchall()
        except (requests.RequestException, psycopg.Error) as e:
            # Surface backend problems (Ollama or Postgres unreachable) to the caller.
            raise ToolError(f"search_notes backend error: {type(e).__name__}: {e}") from e
        return {
            "query": query,
            "results": [
                {"source": source, "distance": round(float(distance), 4), "chunk": chunk}
                for source, chunk, distance in rows
            ],
        }


    # ---------- fo_*: read-only OData against the mock FO service ----------

    def _odata_get(path, params=None):
        try:
            r = requests.get(f"{FO_BASE_URL}/data/{path}", params=params, timeout=15,
                             headers={"Accept": "application/json", "OData-Version": "4.0"})
        except requests.RequestException as e:
            raise ToolError(f"FO OData service unreachable: {type(e).__name__}: {e}") from e
        if r.status_code >= 400:
            try:
                message = r.json()["error"]["message"]
            except (ValueError, KeyError, TypeError):
                message = r.text[:300]
            raise ToolError(f"OData error {r.status_code}: {message}")
        return r


    def _metadata():
        root = ET.fromstring(_odata_get("$metadata").content)
        sets = {}
        for es in root.iter(EDM + "EntitySet"):
            sets[es.get("Name")] = es.get("EntityType").rsplit(".", 1)[-1]
        types = {}
        for et in root.iter(EDM + "EntityType"):
            keys = [p.get("Name") for p in et.iter(EDM + "PropertyRef")]
            fields = [{"name": p.get("Name"), "type": p.get("Type")} for p in et.iter(EDM + "Property")]
            types[et.get("Name")] = {"keys": keys, "fields": fields}
        return sets, types


    def _check_entity(entity):
        if not re.fullmatch(r"[A-Za-z][A-Za-z0-9]{0,79}", entity or ""):
            raise ToolError("entity must be an OData entity set name such as CustomersV3")


    @mcp.tool()
    def fo_list_entities() -> dict[str, Any]:
        """List the entity sets (for example CustomersV3) that the mock FO OData service exposes."""
        sets, _ = _metadata()
        return {"source": "fo-mock (fake demo data)", "entity_sets": sorted(sets)}


    @mcp.tool()
    def fo_get_entity_metadata(entity: str) -> dict[str, Any]:
        """Return the key fields and all field names/types for one FO entity set, read from /data/$metadata."""
        _check_entity(entity)
        sets, types = _metadata()
        if entity not in sets:
            raise ToolError(f"Unknown entity set {entity}. Known: {', '.join(sorted(sets))}")
        info = types[sets[entity]]
        return {"entity_set": entity, "entity_type": sets[entity], "keys": info["keys"], "fields": info["fields"]}


    @mcp.tool()
    def fo_query(entity: str, filter: str | None = None, top: int = 10,
                 select: str | None = None, cross_company: bool = False) -> dict[str, Any]:
        """Read records from a mock Dynamics 365 FO OData entity set (fake demo data).

        entity: entity set name, e.g. CustomersV3, VendorsV2, ReleasedProductsV2, SalesOrderHeadersV2.
        filter: OData $filter using eq joined by 'and', e.g. "CustomerGroupId eq '30'".
        top: max rows, 1 to 50. select: comma-separated field names.
        cross_company: true to include companies other than the default (usmf).
        """
        _check_entity(entity)
        params = {"$top": str(max(1, min(int(top), 50))), "$count": "true"}
        if filter:
            params["$filter"] = filter
        if select:
            params["$select"] = select
        if cross_company:
            params["cross-company"] = "true"
        body = _odata_get(entity, params).json()
        return {
            "source": "fo-mock (fake demo data)",
            "entity_set": entity,
            "matched": body.get("@odata.count"),
            "returned": len(body.get("value", [])),
            "records": body.get("value", []),
        }


    @mcp.custom_route("/healthz", methods=["GET"])
    async def healthz(request: Request) -> PlainTextResponse:
        return PlainTextResponse("ok\n")


    if __name__ == "__main__":
        mcp.run(
            transport="streamable-http",
            host="0.0.0.0",
            port=PORT,
            streamable_http_path="/mcp",
            stateless_http=True,
            json_response=True,
            transport_security=TransportSecuritySettings(
                enable_dns_rebinding_protection=True,
                allowed_hosts=ALLOWED_HOSTS,
                allowed_origins=["http://127.0.0.1:*", "http://localhost:*"],
            ),
        )
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-test-code
  namespace: ai-lab
  labels:
    app: mcp-test
data:
  test_client.py: |
    """In-cluster smoke test for the day 6 MCP server.

    Connects twice (modern protocol auto-negotiation, then the legacy initialize
    handshake that older clients use), lists the tools, calls search_notes and the
    fo_* tools, and prints the results. Optionally checks that the fo-mock
    NetworkPolicy blocks this pod (and reports whether pgvector is reachable). Exits non-zero if an MCP check fails.
    """
    import asyncio
    import json
    import os
    import socket
    import sys

    from mcp import Client

    URL = os.environ.get("MCP_URL", "http://mcp-server.ai-lab.svc.cluster.local:8000/mcp")
    QUESTION = os.environ.get("TEST_QUESTION", "What GPU is in the lab host and how much VRAM does it have?")
    FO_HOST = os.environ.get("FO_MOCK_HOST", "fo-mock.ai-lab.svc.cluster.local")
    FO_PORT = int(os.environ.get("FO_MOCK_PORT", "8080"))
    PG_HOST = os.environ.get("PGVECTOR_HOST", "pgvector.ai-lab.svc.cluster.local")
    WAIT_SECONDS = int(os.environ.get("WAIT_SECONDS", "300"))


    def root_cause(e):
        """Unwrap anyio ExceptionGroups so the real error (e.g. ConnectError) is printed."""
        while isinstance(e, BaseExceptionGroup) and e.exceptions:
            e = e.exceptions[0]
        return e


    def show(result):
        if result.is_error:
            text = " ".join(getattr(c, "text", "") for c in result.content)
            raise RuntimeError("tool returned an error: " + text)
        return result.structured_content or json.loads(result.content[0].text)


    async def run(mode):
        print(f"\n=== connecting to {URL} (mode={mode})")
        async with Client(URL, mode=mode) as client:
            tools = await client.list_tools()
            names = sorted(t.name for t in tools.tools)
            print("tools:", ", ".join(names))
            expected = {"search_notes", "fo_query", "fo_get_entity_metadata", "fo_list_entities"}
            if not expected <= set(names):
                raise RuntimeError(f"missing tools: {expected - set(names)}")
            if mode == "legacy":
                # Older clients (for example Open WebUI's backend) still use this handshake.
                q = show(await client.call_tool("fo_query", {"entity": "VendorsV2", "top": 1}))
                print(f"  fo_query VendorsV2 over the legacy handshake: returned={q['returned']}")
                return

            print(f"\n--- search_notes: {repr(QUESTION)}")
            data = show(await client.call_tool("search_notes", {"query": QUESTION, "k": 3}))
            for r in data["results"]:
                preview = " ".join(r["chunk"].split())[:70]
                print(f"  {r['distance']:.3f}  {r['source']}  {preview}...")
            if not data["results"]:
                raise RuntimeError("search_notes returned no rows (did the day 4 ingest run?)")

            print("\n--- fo_list_entities")
            print("  " + ", ".join(show(await client.call_tool("fo_list_entities", {}))["entity_sets"]))

            print("\n--- fo_get_entity_metadata: CustomersV3")
            meta = show(await client.call_tool("fo_get_entity_metadata", {"entity": "CustomersV3"}))
            print("  keys:", meta["keys"], " fields:", len(meta["fields"]))

            print("\n--- fo_query: CustomersV3 where CustomerGroupId eq '30'")
            q = show(await client.call_tool("fo_query", {
                "entity": "CustomersV3", "filter": "CustomerGroupId eq '30'",
                "select": "CustomerAccount,OrganizationName,AddressCity", "top": 5}))
            print(f"  matched={q['matched']} returned={q['returned']}")
            for rec in q["records"]:
                print("  ", rec)

            print("\n--- fo_query: SalesOrderHeadersV2 backorders for DEMO-C0001")
            q = show(await client.call_tool("fo_query", {
                "entity": "SalesOrderHeadersV2",
                "filter": "OrderingCustomerAccountNumber eq 'DEMO-C0001' and SalesOrderStatus eq 'Backorder'",
                "select": "SalesOrderNumber,RequestedShippingDate,OrderTotalAmount"}))
            for rec in q["records"]:
                print("  ", rec)

            print("\n--- fo_query with an unsupported filter (expect a clean tool error)")
            bad = await client.call_tool("fo_query", {"entity": "CustomersV3", "filter": "CreditLimit gt 1000"})
            print("  is_error =", bad.is_error, "|", " ".join(getattr(c, "text", "") for c in bad.content)[:160])


    def tcp_reachable(host, port):
        try:
            socket.create_connection((host, port), timeout=3).close()
            return True, "connected"
        except OSError as e:
            return False, type(e).__name__


    def check_network_policies():
        print("\n=== NetworkPolicy checks (direct TCP from this test pod)")
        ok, how = tcp_reachable(FO_HOST, FO_PORT)
        print(f"  fo-mock  {FO_HOST}:{FO_PORT}: " + (
            "REACHABLE - fo-mock is NOT isolated (NetworkPolicy missing or not enforced)" if ok
            else f"blocked as expected ({how})"))
        ok_pg, how_pg = tcp_reachable(PG_HOST, 5432)
        print(f"  pgvector {PG_HOST}:5432: " + (
            "reachable (expected unless the optional pgvector policy is applied)" if ok_pg
            else f"blocked ({how_pg}) - the optional pgvector policy is active"))
        return not ok


    async def wait_for_server():
        deadline = asyncio.get_running_loop().time() + WAIT_SECONDS
        while True:
            try:
                async with Client(URL, mode="legacy") as client:
                    await client.list_tools()
                return
            except Exception as e:
                e = root_cause(e)
                if asyncio.get_running_loop().time() > deadline:
                    raise RuntimeError(f"MCP server not reachable after {WAIT_SECONDS}s: {type(e).__name__}: {e}") from e
                print(f"waiting for {URL} ({type(e).__name__}), retrying in 5s", flush=True)
                await asyncio.sleep(5)


    async def main():
        await wait_for_server()
        await run("auto")
        await run("legacy")
        isolated = check_network_policies() if os.environ.get("CHECK_NETPOL", "1") == "1" else True
        print("\nALL MCP CHECKS PASSED" + ("" if isolated else " (but see the NetworkPolicy warning above)"))


    if __name__ == "__main__":
        try:
            asyncio.run(main())
        except Exception as e:
            e = root_cause(e)
            print(f"\nTEST FAILED: {type(e).__name__}: {e}")
            sys.exit(1)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fo-mock
  namespace: ai-lab
  labels:
    app: fo-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fo-mock
  template:
    metadata:
      labels:
        app: fo-mock
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fo-mock
          image: python:3.12-slim
          command: ["python", "/app/fo_mock.py"]
          env:
            - name: PORT
              value: "8080"
            - name: FO_DEFAULT_COMPANY
              value: usmf
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: fo-mock-code
---
