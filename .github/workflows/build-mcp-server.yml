# Build ghcr.io/<owner>/mcp-server on every push to main that changes apps/mcp-server/ or its workflow files.
# "Run workflow" on the Actions tab (workflow_dispatch) rebuilds it by hand.
name: build mcp-server

on:
  push:
    branches: [main]
    paths:
      - "apps/mcp-server/**"
      - ".github/workflows/build-mcp-server.yml"
      - ".github/workflows/_build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-mcp-server
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_build-image.yml
    with:
      app: mcp-server
    permissions:
      contents: read
      packages: write
